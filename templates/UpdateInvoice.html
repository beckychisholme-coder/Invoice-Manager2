<!-- html for the update invoice page -->
 
{% extends 'base.html' %}
 
{% block title %}Update Invoice{% endblock %}
 
{% block content %}
{% if errors %}
<!-- errors list -->
<div class="alert alert-danger">
  <ul>
    {% for e in errors %}
      <li>{{ e }}</li>
    {% endfor %}
  </ul>
</div>
{% endif %}
 
<h1>Update Invoice</h1>
<a href="/View Invoices" class="btn btn-secondary">Back to Invoices</a>
 
<div class="container mt-4">
  <!-- form for updating invoice -->
  <form method="POST" action="{{ url_for('update_invoice_route', invoice_id=invoice['invoice_id']) }}">
    <div class="row g-4 p-4 border rounded bg-light">
 
      <div class="col-md-6">
        <h4>Customer Details</h4>
        <label class="form-label mt-2">Name:</label>
        <input type="text" class="form-control" name="customer_name" value="{{ invoice['customer_name'] }}" required>
 
        <label class="form-label mt-3">Address:</label>
        <input type="text" class="form-control" name="customer_address" value="{{ invoice['customer_address'] }}" required>
 
        <label class="form-label mt-3">Date:</label>
        <input type="date" class="form-control" name="date" value="{{ invoice['date'] }}" required>
      </div>
 
      <div class="col-md-6">
        <h4>Invoice Details</h4>
        <label class="form-label mt-2">Invoice Number:</label>
        <input type="text" class="form-control" name="invoice_no" value="{{ invoice['invoice_no'] }}" required>
 
        <label class="form-label mt-3">Description:</label>
        <textarea class="form-control" name="item_description" rows="3">{{ invoice['item_description'] }}</textarea>
 
 
        <label class="form-label mt-3">Total:</label>
        <input type="number" step="0.01" class="form-control" name="total" value="{{ invoice['total'] }}" required>
      </div>
 
      <div class="col-12 mt-4">
        <button type="submit" class="btn btn-primary px-4">Update Invoice</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
